<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción al torneo de videojuegos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <form action="#" method="post">
            <h1>Inscripción al torneo</h1>

            <fieldset>
                <legend>Datos personales</legend>

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="edad">Edad (mínimo 16)</label>
                    <input type="number" id="edad" name="edad" min="16" max="120">
                </div>

                <div class="campo">
                    <label for="nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="nacimiento" name="nacimiento">
                </div>
            </fieldset>

            <fieldset>
                <legend>Cuenta de jugador</legend>

                <div class="campo">
                    <label for="nickname">Nickname (3 a 15 caracteres)</label>
                    <input type="text" id="nickname" name="nickname" minlength="3" maxlength="15" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Torneo</legend>

                <div class="campo">
                    <label for="juego">Videojuego del torneo</label>
                    <select id="juego" name="juego">
                        <option value="">-- Elige un videojuego --</option>
                        <option value="fifa">EA Sports FC</option>
                        <option value="lol">League of Legends</option>
                        <option value="fortnite">Fortnite</option>
                        <option value="valorant">Valorant</option>
                        <option value="rocket">Rocket League</option>
                    </select>
                </div>

                <p class="titulo-grupo">Plataforma</p>
                <div class="opciones">
                    <input type="radio" id="pc" name="plataforma" value="pc">
                    <label for="pc">PC</label>

                    <input type="radio" id="ps" name="plataforma" value="playstation">
                    <label for="ps">PlayStation</label>

                    <input type="radio" id="xbox" name="plataforma" value="xbox">
                    <label for="xbox">Xbox</label>
                </div>

                <p class="titulo-grupo">Disponibilidad horaria</p>
                <div class="opciones">
                    <input type="checkbox" id="manana" name="disponibilidad" value="manana">
                    <label for="manana">Mañana</label>

                    <input type="checkbox" id="tarde" name="disponibilidad" value="tarde">
                    <label for="tarde">Tarde</label>

                    <input type="checkbox" id="noche" name="disponibilidad" value="noche">
                    <label for="noche">Noche</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Extras</legend>

                <div class="campo">
                    <label for="comentarios">Comentarios adicionales</label>
                    <textarea id="comentarios" name="comentarios" rows="4"></textarea>
                </div>

                <div class="opciones">
                    <input type="checkbox" id="normas" name="normas" required>
                    <label for="normas">Acepto las <a href="normas.html" target="_blank" rel="noopener">normas</a> del
                        torneo</label>
                </div>
            </fieldset>

            <div class="botones">
                <button type="submit">Inscribirme</button>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
    </main>
</body>

</html>
